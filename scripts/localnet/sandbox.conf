# Lute local Canton sandbox: overrides on top of the built-in sandbox config.
# Every API is bound to loopback. The sandbox has no auth, and the build host is shared
# with no firewall, so nothing may listen on a public interface.
# Reach it from a laptop via SSH tunnel (scripts/localnet/README.md).
canton {
  participants.sandbox {
    admin-api.address = "127.0.0.1"
    http-ledger-api.address = "127.0.0.1"
    ledger-api.address = "127.0.0.1"
  }
  sequencers.sequencer1 {
    admin-api.address = "127.0.0.1"
    public-api.address = "127.0.0.1"
  }
  mediators.mediator1.admin-api.address = "127.0.0.1"
}
